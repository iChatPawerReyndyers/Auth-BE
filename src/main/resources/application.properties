spring.application.name=Auth-BE
server.port=8080

# Neon PostgreSQL datasource. Keep credentials in environment variables.
spring.datasource.url=jdbc:postgresql://ep-dry-voice-b3bnpd7w-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${NEON_DATABASE_USERNAME}
spring.datasource.password=${NEON_DATABASE_PASSWORD}
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dev/testing only: when true, /api/auth/login accepts ANY password for an
# existing username. Defaults to false here so a normal run is never
# affected. Enabled only via the "dev" profile (application-dev.properties) —
# never set this to true in this file.
app.security.skip-password-check=false

# Short-lived identity token for trusted app backends (e.g. Cartculate) to
# resolve an Auth account to their own local user ID. Share this secret only
# with backend services that validate these tokens; never put it in mobile apps.
app.jwt.secret=${AUTH_JWT_SECRET}
app.jwt.issuer=ichat-auth
app.jwt.expiration-seconds=600

# Days of free access granted to a new registration that doesn't specify its
# own subscriptionExpiresAt.
app.subscription.default-trial-days=30

# --- Google / Facebook OAuth ---
# Fill these via environment variables (see docs/OAUTH_SETUP.md for how to
# obtain each one). Left empty, sign-in with that provider returns a clear
# "not configured yet" error instead of failing silently.
#
# Comma-separated: Google issues a separate client ID per platform (web,
# iOS, Android) and a token minted for any one of them should be accepted.
app.oauth.google.client-ids=${GOOGLE_CLIENT_IDS:}

app.oauth.facebook.app-id=${FACEBOOK_APP_ID:}
# Secret — set only as an environment variable, never commit a real value here.
app.oauth.facebook.app-secret=${FACEBOOK_APP_SECRET:}

# --- Multi-app subscription gating ---
# App IDs in this comma-separated list skip the subscription check at login
# entirely — everything else requires an active subscription. Each app
# passes its own ID as `appId` in /login, /oauth/google, /oauth/facebook.
# Current plan: Stickies and Galleries are free; Calculator and anything
# else require a subscription.
app.clients.free-ids=${APP_FREE_CLIENT_IDS:stickies,galleries}

# --- Password reset via SMS OTP ---
# Minutes a one-time code stays valid after being sent.
app.otp.expiry-minutes=5
# No real SMS provider is wired in yet — codes are logged to the console by
# ConsoleSmsSender. See docs/SMS_OTP_SETUP.md to send real texts.
